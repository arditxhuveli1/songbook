name: Deploy songbook

on:
  push:
    branches: [main]
    paths:
      - "songs/**"
      - "site/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          mkdir -p _site/songs
          cp -r songs/. _site/songs/
          rm -f _site/songs/.gitkeep _site/songs/~\$*

      - name: Build manifest
        run: node scripts/build-manifest.mjs songs _site/songs.json

      # Pages caches every file for 10 minutes, so a browser can pair a fresh
      # HTML page with a stale script. Stamp local script, module and
      # stylesheet URLs with the commit so each deploy loads its own files.
      - name: Stamp asset URLs with the commit
        run: |
          v="${GITHUB_SHA::7}"
          sed -i -E "s#(href|src)=\"(css|js)/([^\"?]+)\"#\1=\"\2/\3?v=$v\"#g" _site/*.html
          sed -i -E "s#from \"\./([a-z]+\.js)\"#from \"./\1?v=$v\"#g" _site/js/*.js
          grep -ho '?v=[0-9a-f]*' _site/*.html _site/js/*.js | sort | uniq -c

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
